# Last full audit of the SDK and dependencies: 06.09.2026
name: metrica_base
description: "Unified Yandex analytics and crash reporting for Flutter applications: AppMetrica on mobile, Yandex Metrica on the web"
version: 0.0.3
homepage: https://github.com/AlexSeednov/metrica_base
# Not publishable: pub.dev rejects git dependencies, and application_base is
# one.
publish_to: 'none'

environment:
  # Minimum Flutter SDK. The packages it pins:
  # https://github.com/flutter/flutter/blob/3.44.4/packages/flutter/pubspec.yaml
  # Release notes: https://github.com/flutter/flutter/blob/stable/CHANGELOG.md
  flutter: '>=3.44.4'

  # Minimum Dart SDK. The one each Flutter release ships:
  # https://docs.flutter.dev/release/archive
  # Release notes: https://dart.googlesource.com/sdk/+/stable/CHANGELOG.md
  sdk: '>=3.12.2'

dependencies:
  # All platform supported
  #
  # A range rather than a caret: the package uses nothing newer than 0.3.7, so
  # both minor lines in use across the applications resolve, and neither has
  # to move for this package.
  application_base:
    git:
      url: https://github.com/AlexSeednov/application_base
      tag_pattern: v{{version}}
    version: '>=0.3.7 <0.5.0'

  # Not supported: Linux | macOS | Web | Windows
  #
  # Compiles everywhere (the Dart side is a plain platform channel), but only
  # Android and iOS carry an SDK behind it; the services on top of it are
  # registered for the `mobile` DI environment, which takes every non-web
  # platform.
  appmetrica_plugin: ^4.0.0

  # All platform supported
  #
  # Screen views are reported by a router observer
  auto_route: ^11.1.0

  # All platform supported
  #
  # Money amounts of the E-commerce reports
  decimal: ^3.2.4

  # Base SDK
  flutter:
    sdk: flutter

  # All platform supported
  injectable: ^3.0.0

  # All platform supported
  meta: ^1.16.0

dev_dependencies:
  # dart run build_runner build
  #
  # Resolves below 2.15.2: that one requires analyzer 13.3+, which wants a
  # newer `meta` than Flutter 3.44.4 pins.
  build_runner: ^2.15.0

  # Assertions in tests
  checks: ^0.3.1

  #
  flutter_test:
    sdk: flutter

  # dart run build_runner build
  injectable_generator: ^3.1.0

flutter:
